<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HomeAuth</title>
    <!-- 首屏防闪白：在 React/样式挂载前给 <html> 打 data-theme 并同步 color-scheme。
         与 web/src/theme.ts 同一套语义：theme_mode ∈ {auto,light,dark}，非法/不可用回退 auto。 -->
    <script>
      (function () {
        var resolved = 'light';
        try {
          var mode = window.localStorage.getItem('theme_mode');
          if (mode !== 'auto' && mode !== 'light' && mode !== 'dark') mode = 'auto';
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          resolved = dark ? 'dark' : 'light';
        } catch (e) {
          resolved = 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        var meta = document.createElement('meta');
        meta.setAttribute('name', 'color-scheme');
        meta.setAttribute('content', resolved);
        document.head.appendChild(meta);
      })();
    </script>
    <!-- 运行期配置：仅回跳白名单域名根，由后端 GET /config.js 注入，构建期不打包 -->
